name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: feesconnect, POSTGRES_PASSWORD: test, POSTGRES_DB: feesconnect}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U feesconnect" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://feesconnect:test@127.0.0.1:5432/feesconnect
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: black --check . && isort --check-only . && ruff check .
      - run: pytest

  docker-smoke:
    # This checks the actual image on a runner with Docker and PostgreSQL available.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: feesconnect, POSTGRES_PASSWORD: test, POSTGRES_DB: feesconnect}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U feesconnect" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Build image without production secrets
        run: docker build -t feesconnect-ci .
      - name: Create temporary, non-production runtime configuration
        # Only isolated CI services use these values; no real email/provider call is made.
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          from pathlib import Path
          settings = {
              "DJANGO_SETTINGS_MODULE": "config.settings.prod",
              "DJANGO_SECRET_KEY": base64.b64encode(secrets.token_bytes(32)).decode(),
              "DATA_ENCRYPTION_KEY": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              "DATABASE_URL": "postgresql://feesconnect:test@127.0.0.1:5432/feesconnect",
              "REDIS_URL": "redis://127.0.0.1:6379/0",
              "SITE_URL": "https://localhost",
              "DJANGO_ALLOWED_HOSTS": "localhost,127.0.0.1",
              "MS_TENANT_ID": "ci-tenant",
              "MS_CLIENT_ID": "ci-client",
              "MS_CLIENT_SECRET": "ci-value-no-external-calls",
              "PORT": "18000",
              "WEB_CONCURRENCY": "1",
              "STARTUP_TIMEOUT": "30",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "feesconnect-ci.env"
          path.write_text("\n".join(f"{k}={v}" for k, v in settings.items()) + "\n")
          path.chmod(0o600)
          PY
      - name: Run pre-deploy migrations and start web, worker and beat
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/feesconnect-ci.env" feesconnect-ci python deployment/start.py release
          docker run -d --name fc-web --network host --env-file "$RUNNER_TEMP/feesconnect-ci.env" feesconnect-ci
          docker run -d --name fc-worker --network host --env-file "$RUNNER_TEMP/feesconnect-ci.env" feesconnect-ci python deployment/start.py worker
          docker run -d --name fc-beat --network host --env-file "$RUNNER_TEMP/feesconnect-ci.env" feesconnect-ci python deployment/start.py beat
      - name: Check readiness, pages, static files, PDF libraries and Celery
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18000/readyz/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/readyz/
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/ >/dev/null
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/static/feesconnect/site.css >/dev/null
          docker exec fc-web python -c 'from weasyprint import HTML; assert HTML(string="<p>Receipt test</p>").write_pdf().startswith(b"%PDF")'
          docker exec fc-worker python -c 'from config.celery import app; assert app.control.ping(timeout=10)'
          docker logs fc-beat 2>&1 | rg 'beat: Starting'
      - name: Inspect logs and stop CI services
        if: always()
        run: |
          docker logs fc-web 2>&1 || true
          docker logs fc-worker 2>&1 || true
          docker logs fc-beat 2>&1 || true
          docker rm -f fc-web fc-worker fc-beat || true
