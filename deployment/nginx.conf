# Install after issuing the certificate; begin with the HTTP bootstrap below.
upstream feesconnect_app { server unix:/run/feesconnect/gunicorn.sock; }
server {
    listen 80;
    server_name feesconnect.com www.feesconnect.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://feesconnect.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.feesconnect.com;
    ssl_certificate /etc/letsencrypt/live/feesconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feesconnect.com/privkey.pem;
    return 301 https://feesconnect.com$request_uri;
}
server {
    listen 443 ssl;
    server_name feesconnect.com;
    ssl_certificate /etc/letsencrypt/live/feesconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feesconnect.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location /static/ { alias /var/www/feesconnect/static/; expires 30d; }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://feesconnect_app;
        proxy_read_timeout 65s;
    }
    # Private invoices/receipts have no static alias and are served by Django.
}
