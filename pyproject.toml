[project]
name = "feesconnect"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
description = "FeesConnect school fee payment platform"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=apps --cov-report=term-missing --cov-report=html --cov-fail-under=85"
markers = ["postgres: PostgreSQL-only transaction/concurrency checks"]
[tool.coverage.run]
omit = ["*/migrations/*"]
[tool.black]
target-version = ["py312"]
line-length = 100
[tool.isort]
profile = "black"
line_length = 100
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E702"]
[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
